services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: procureai-app:latest
    container_name: procureai-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-procure_ai}
      DB_USERNAME: ${DB_USERNAME:-procure}
      DB_PASSWORD: ${DB_PASSWORD:-procure_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - procureai

  nginx:
    image: nginx:1.27-alpine
    container_name: procureai-nginx
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - vendor_data:/var/www/html/vendor:ro
      - node_modules_data:/var/www/html/node_modules:ro
    depends_on:
      - app
    networks:
      - procureai

  mysql:
    image: mysql:8.0
    container_name: procureai-mysql
    restart: unless-stopped
    ports:
      - "${DB_PUBLISH_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-procure_ai}
      MYSQL_USER: ${DB_USERNAME:-procure}
      MYSQL_PASSWORD: ${DB_PASSWORD:-procure_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - procureai

  redis:
    image: redis:7-alpine
    container_name: procureai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - procureai

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: procureai-app:latest
    container_name: procureai-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-procure_ai}
      DB_USERNAME: ${DB_USERNAME:-procure}
      DB_PASSWORD: ${DB_PASSWORD:-procure_secret}
      REDIS_HOST: redis
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - procureai

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: procureai-app:latest
    container_name: procureai-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-procure_ai}
      DB_USERNAME: ${DB_USERNAME:-procure}
      DB_PASSWORD: ${DB_PASSWORD:-procure_secret}
      REDIS_HOST: redis
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - procureai

networks:
  procureai:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  vendor_data:
  node_modules_data:
